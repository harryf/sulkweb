# Release-gated GitHub Pages deploy (stable root + frozen version snapshot).
#
# The git tag is the single source of truth for a release: pushing a v* tag
# runs the verification gate (typecheck + full unit suites), builds the client
# with SULK_VERSION set from the tag, and publishes the build TWICE into the
# gh-pages site tree:
#
#   /            the stable root (always the last released version)
#   /X.Y.Z/      a frozen snapshot that never changes again (X.Y.Z = tag minus v)
#
# The gh-pages branch is the persistent site tree; every deploy pushes it and
# then publishes the ENTIRE tree as the Pages artifact, so frozen versions and
# /latest/ survive every subsequent deploy. /latest/ is owned exclusively by
# deploy-latest.yml; this workflow never writes it. versions.html is
# regenerated from whatever version dirs exist on disk.
#
# A re-run of a tag only rewrites the root and that tag's own directory (the
# dir name derives from the ref), never any other version. That is also the
# ROLLBACK lever: re-run an older tag's workflow from the Actions UI and the
# stable root becomes that version again (its own frozen dir is rewritten with
# identical content).
#
# Site-size note: each frozen version is roughly 40MB (audio included) against
# the 1GB Pages soft limit; revisit asset dedup after ~20 releases.

name: Deploy release to GitHub Pages

on:
  push:
    tags: ['v*']
  # Dispatch against a tag ref = permanent rollback lever (run re-runs from
  # the Actions UI expire after 30 days; a dispatch never does).
  workflow_dispatch:

# Permissions are scoped PER JOB below (least privilege): the build job runs
# third-party code (pnpm lifecycle scripts) and must not hold actions: write.

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify-build-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck engine (tsc -b via build)
        run: pnpm --filter @sulk/engine build

      - name: Typecheck client
        run: pnpm --filter client exec tsc --noEmit

      - name: Unit tests (engine + client)
        run: pnpm -r test

      - name: Build client (version = tag)
        env:
          SULK_VERSION: ${{ github.ref_name }}
        run: pnpm --filter client build

      - name: Sync build into the versioned site tree (root + frozen /X.Y.Z/)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION_DIR="${GITHUB_REF_NAME#v}"
          # Strict vX.Y.Z only: the preserve-regex, the versions-page glob, and
          # the manual's version-dir regex all assume it. A looser tag would
          # create a snapshot the NEXT release silently deletes, and a
          # pathological tag like vlatest would clobber /latest/.
          [[ "$VERSION_DIR" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "release tags must be vX.Y.Z, got ${GITHUB_REF_NAME}"; exit 1; }
          mkdir site && cd site
          git init -q -b gh-pages
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # depth=1: never materialize the branch's ever-growing history.
          # Self-bootstrapping: if gh-pages does not exist yet, start an orphan
          # tree; every root file is (re)written unconditionally below, so the
          # from-scratch result is a complete, correct site.
          { git fetch -q --depth=1 origin gh-pages && git checkout -q gh-pages; } \
            || git checkout -q --orphan gh-pages
          # Refresh the stable root: clear root-level entries but preserve
          # every frozen version dir, latest/, and .git itself.
          find . -maxdepth 1 ! -name . ! -name .git ! -name latest \
            -regextype posix-extended ! -regex '\./[0-9]+\.[0-9]+\.[0-9]+' \
            -exec rm -rf {} +
          cp -R ../packages/client/dist/. .
          rm -rf "$VERSION_DIR"
          cp -R ../packages/client/dist "$VERSION_DIR"
          echo "$GITHUB_REF_NAME" > STABLE_VERSION
          touch .nojekyll
          MANIFEST="{\"version\":\"${GITHUB_REF_NAME}\",\"sha\":\"${GITHUB_SHA}\",\"built\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}"
          echo "$MANIFEST" > manifest.json
          echo "$MANIFEST" > "$VERSION_DIR/manifest.json"
          bash ../scripts/genVersionsPage.sh
          git add -A
          git -c user.name=sulkweb-deploy -c user.email=deploy@users.noreply.github.com \
            commit -q -m "Release ${GITHUB_REF_NAME}: stable root + frozen /${VERSION_DIR}/" \
            || echo "site tree unchanged"
          git push -q origin gh-pages
          rm -rf .git

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact (entire site tree)
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: verify-build-publish
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # /latest/ tracks main HEAD, but the shared "pages" concurrency group keeps
  # only ONE pending run: this release run entering the queue can REPLACE a
  # main push's pending deploy-latest run, and that commit then never reaches
  # /latest/ until the next push. Heal it deterministically: every release run
  # re-dispatches deploy-latest against main head, ALWAYS (if: always()): the
  # displacement happens at queue time, so a release that fails its test gate
  # still owes the heal. The rebuild is content-identical but re-stamps the
  # manifest (not a literal no-op). Dispatch failure must never turn an
  # already-deployed release red: continue-on-error plus a loud warning.
  # (Explicit dispatch API calls with GITHUB_TOKEN are allowed; only
  # token-caused push/PR events are blocked by the anti-recursion guard.
  # deploy-latest dispatches nothing itself, so there is no recursion path.)
  redispatch-latest:
    needs: [verify-build-publish, deploy]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    continue-on-error: true
    steps:
      - name: Re-dispatch latest deploy (heal queue pre-emption)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run deploy-latest.yml --ref main --repo "$GITHUB_REPOSITORY" \
            || echo "::warning::latest re-dispatch failed; run 'gh workflow run deploy-latest.yml --ref main' manually"
